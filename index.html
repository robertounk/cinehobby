  <script>
    function isInAppBrowser() {
      return /fbav|fban|telegram|whatsapp|instagram|line|viber/i.test(navigator.userAgent);
    }
    function isInstagram() {
      return /instagram/i.test(navigator.userAgent);
    }
    function isIOS() {
      return /iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    window.openInBrowser = function() {
      const pageUrl = window.location.href;
      const encoded = encodeURIComponent(pageUrl);
      const host = window.location.hostname;
      const path = window.location.pathname + (window.location.search || '');
      if (/android/i.test(navigator.userAgent)) {
        window.location.href = 'intent://' + host + path + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encoded + ';end';
      } else if (/iphone|ipad/i.test(navigator.userAgent)) {
        window.location.href = pageUrl.replace(/^https?:\/\//, 'googlechrome://');
        setTimeout(function() { window.location.href = pageUrl; }, 2500);
      } else {
        window.open(pageUrl, '_blank');
      }
    };

    window.copiarLinkPagina = function(btn) {
      const url = window.location.href;
      function sucesso() {
        if (btn) { var orig = btn.textContent; btn.textContent = '✓ Copiado!'; setTimeout(function(){ btn.textContent = orig; }, 2500); }
      }
      function fallback() {
        try {
          var t = document.createElement('textarea'); t.value = url;
          t.style.cssText = 'position:fixed;opacity:0;top:0;left:0'; document.body.appendChild(t);
          t.focus(); t.select(); document.execCommand('copy'); document.body.removeChild(t); sucesso();
        } catch(e) { prompt('Copie este link e abra no Chrome:', url); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(sucesso).catch(fallback);
      } else { fallback(); }
    };

    window.abrirDownloads = function() {
      const ua = navigator.userAgent.toLowerCase();
      if (/android/i.test(ua)) { window.location.href = 'file:///sdcard/Download/'; }
      else if (/iphone|ipad/i.test(ua)) { window.location.href = 'shareddocuments://'; }
    };

    // INSTAGRAM: Modal bloqueante na abertura da página
    if (isInstagram()) {
      document.addEventListener('DOMContentLoaded', function() {
        if (document.getElementById('modalInstagram')) return;
        const overlay = document.createElement('div');
        overlay.id = 'modalInstagram';
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.97);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;animation:fadeIn 0.3s ease;';

        const box = document.createElement('div');
        box.style.cssText = 'background:linear-gradient(160deg,#0a0f1e 0%,#0f172a 100%);border:2px solid rgba(239,68,68,0.65);border-radius:20px;padding:30px 22px;max-width:400px;width:100%;text-align:center;box-shadow:0 0 60px rgba(239,68,68,0.2);animation:slideUp 0.4s ease;';

        box.innerHTML = `
          <div style="width:64px;height:64px;background:linear-gradient(135deg,#EF4444,#B91C1C);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.8rem;box-shadow:0 0 30px rgba(239,68,68,0.5);">🚫</div>
          <h2 style="font-size:1.25rem;font-weight:700;color:#fff;margin-bottom:8px;font-family:'Orbitron','Poppins',sans-serif;line-height:1.2;">Instagram bloqueia downloads!</h2>
          <p style="color:#FCA5A5;font-size:0.85rem;line-height:1.65;margin-bottom:20px;">O navegador interno do Instagram <strong>impede o download de APK</strong>. Para instalar o Cine Hobby você precisa abrir no Chrome.</p>

          <button onclick="window.openInBrowser();" style="width:100%;padding:16px;background:linear-gradient(135deg,#10B981,#059669);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:1rem;margin-bottom:10px;box-shadow:0 4px 20px rgba(16,185,129,0.5);letter-spacing:0.5px;">
            🌐 ABRIR NO CHROME AGORA
          </button>

          <div style="margin-bottom:10px;">
            <div style="font-size:0.7rem;color:#64748B;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">Ou copie e cole no Chrome:</div>
            <div style="background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px;font-size:0.7rem;color:#60A5FA;word-break:break-all;cursor:pointer;user-select:all;-webkit-user-select:all;line-height:1.5;" onclick="var s=window.getSelection(),r=document.createRange();r.selectNodeContents(this);s.removeAllRanges();s.addRange(r);">${window.location.href}</div>
          </div>

          <button onclick="window.copiarLinkPagina(this);" style="width:100%;padding:12px;background:rgba(59,130,246,0.15);color:#60A5FA;border:2px solid rgba(59,130,246,0.3);border-radius:10px;font-weight:700;cursor:pointer;font-size:0.85rem;margin-bottom:14px;">
            📋 Copiar link da página
          </button>

          <button onclick="document.getElementById('modalInstagram').style.display='none';" style="background:none;border:none;color:#475569;font-size:0.75rem;cursor:pointer;padding:4px;text-decoration:underline;">
            Continuar mesmo assim (não vai funcionar)
          </button>
        `;

        overlay.appendChild(box);
        document.body.appendChild(overlay);
      });
    } else if (isInAppBrowser()) {
      document.addEventListener('DOMContentLoaded', function() {
        const banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,rgba(245,158,11,0.97),rgba(217,119,6,0.97));padding:12px 16px;z-index:200;display:flex;align-items:center;gap:10px;font-family:Inter,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,0.5);';
        banner.innerHTML = `
          <span style="color:#fff;font-size:0.82rem;font-weight:600;flex:1;line-height:1.3;">⚠️ Para baixar o APK, abra no Chrome ou Safari</span>
          <button onclick="window.openInBrowser();" style="padding:8px 14px;background:#fff;color:#D97706;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.8rem;white-space:nowrap;">Abrir 🔗</button>
        `;
        document.body.prepend(banner);
      });
    }
  </script>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    :root {
      --cyan: #00D4FF;
      --cyan2: #38BDF8;
      --purple: #7C3AED;
      --green: #10B981;
      --green2: #34D399;
      --bg: #030712;
      --bg2: #0a0f1e;
      --card: rgba(255,255,255,0.035);
      --border: rgba(0,212,255,0.13);
      --border-h: rgba(0,212,255,0.35);
      --text: #F1F5F9;
      --muted: #94A3B8;
      --dim: #64748B;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content:'';
      position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index:0;pointer-events:none;
    }

    body::after {
      content:'';
      position:fixed;inset:0;
      background:
        radial-gradient(ellipse 70% 50% at 5% 15%, rgba(0,212,255,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 60% 60% at 95% 85%, rgba(124,58,237,0.08) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(16,185,129,0.03) 0%, transparent 70%);
      z-index:0;pointer-events:none;
    }

    .watermark {
      position:fixed;top:50%;left:50%;
      transform:translate(-50%,-50%) rotate(-45deg);
      font-family:'Orbitron',sans-serif;
      font-size:clamp(50px,8vw,110px);
      font-weight:900;
      color:rgba(0,212,255,0.04);
      z-index:0;pointer-events:none;
      white-space:nowrap;letter-spacing:10px;
    }

    header, section, footer { position:relative; z-index:10; }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius:2px; }

    header {
      position:fixed;top:0;left:0;right:0;z-index:100;
      padding:16px 5%;
      background:rgba(3,7,18,0.94);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(0,212,255,0.18);
      display:flex;justify-content:space-between;align-items:center;
      box-shadow:0 0 40px rgba(0,212,255,0.06);
    }

    .logo {
      font-family:'Orbitron',sans-serif;
      font-size:1.2rem;font-weight:900;
      background:linear-gradient(135deg, var(--cyan) 0%, var(--green2) 100%);
      -webkit-background
